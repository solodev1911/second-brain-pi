name: Feature request
description: Propose a focused improvement to Second Brain
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before the implementation. Changes must preserve explicit saving, repository isolation, and source verification.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot you accomplish today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional implementation or interface ideas.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This proposal keeps memory persistence explicitly user-approved.
          required: true
        - label: This proposal preserves repository isolation or explains why the model must change.
          required: true
