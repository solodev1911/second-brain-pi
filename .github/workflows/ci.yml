name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: graphify/uv.lock

      - name: Install Graphify runtime
        working-directory: graphify
        run: uv sync --locked --extra mcp --no-dev

      - name: Install Node.js dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Audit locked Node.js dependencies with OSV-Scanner
        if: matrix.os == 'ubuntu-latest'
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: |-
            --lockfile=./package-lock.json

      - name: Audit locked Python runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        working-directory: graphify
        run: |
          uv export --quiet --frozen --no-dev --extra mcp --format requirements-txt --no-hashes --output-file "$RUNNER_TEMP/second-brain-runtime-requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/second-brain-runtime-requirements.txt" --progress-spinner off

      - name: Run type, unit, contract, and RPC checks
        run: npm run check

      - name: Verify the installable package
        run: npm run pack:check
